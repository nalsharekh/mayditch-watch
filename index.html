<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f54">
<title>23 Mayditch — Check</title>
<style>
  :root { --green:#1f6f54; --ink:#14211c; --muted:#6b7c74; --bg:#f4f6f5; --card:#fff; --line:#e2e7e4; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); padding:0 0 40px; }
  header { background:var(--green); color:#fff; padding:18px 18px calc(18px + env(safe-area-inset-top)); }
  header h1 { margin:0; font-size:19px; } header p { margin:4px 0 0; opacity:.85; font-size:13px; }
  main { max-width:560px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin:14px 0; }
  h2 { font-size:16px; margin:0 0 12px; }
  label.chk { display:flex; align-items:flex-start; gap:12px; padding:11px 0; border-bottom:1px solid var(--line); }
  label.chk:last-of-type { border-bottom:0; }
  label.chk input { width:24px; height:24px; margin-top:1px; accent-color:var(--green); flex:0 0 auto; }
  textarea, input[type=text] { width:100%; border:1px solid var(--line); border-radius:10px; padding:12px; font:inherit; }
  textarea { min-height:70px; resize:vertical; }
  button { width:100%; border:0; border-radius:12px; padding:15px; font:600 16px inherit; color:#fff; background:var(--green); margin-top:14px; }
  button:disabled { opacity:.5; }
  .tabs { display:flex; gap:8px; margin:14px 0 0; }
  .tabs button { margin:0; background:#eef2f0; color:var(--muted); }
  .tabs button.on { background:var(--green); color:#fff; }
  .cats { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .cats .cat { margin:0; background:#eef2f0; color:var(--ink); font-weight:600; padding:16px 10px; border:2px solid transparent; }
  .cats .cat.on { background:#e3f0ea; border-color:var(--green); color:var(--green); }
  .preview { width:100%; border-radius:10px; margin-top:12px; display:none; }
  .toast { position:fixed; left:16px; right:16px; bottom:16px; background:var(--ink); color:#fff; padding:14px 16px; border-radius:12px; text-align:center; opacity:0; transition:.25s; pointer-events:none; max-width:528px; margin:0 auto; }
  .toast.show { opacity:1; }
  .gate { position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; padding:24px; }
  .gate .card { max-width:360px; width:100%; }
  .muted { color:var(--muted); font-size:13px; } .hide { display:none; }
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="card">
    <h2>23 Mayditch — Check</h2>
    <p class="muted">Enter the access code Nawaf gave you. Once only, on this phone.</p>
    <input type="text" id="codeInput" placeholder="Access code" autocomplete="off">
    <button onclick="saveCode()">Continue</button>
  </div>
</div>

<header class="hide" id="app"><h1>23 Mayditch</h1><p>Weekly check &amp; reporting — synced to Nawaf</p></header>

<main class="hide" id="mainApp">
  <div class="tabs">
    <button class="on" id="tabCheck" onclick="show('check')">Weekly check</button>
    <button id="tabReport" onclick="show('report')">Report something</button>
  </div>

  <section id="viewCheck">
    <div class="card"><h2>Tick what you did</h2><div id="checklist"></div></div>
    <div class="card"><h2>Anything odd?</h2><textarea id="oddNote" placeholder="Leave blank if all fine"></textarea></div>
    <button id="btnCheck" onclick="submitCheck()">Submit weekly check</button>
  </section>

  <section id="viewReport" class="hide">
    <div class="card">
      <h2>What are you reporting?</h2>
      <div class="cats" id="cats">
        <button class="cat on" data-cat="bill">📨 Bill / letter</button>
        <button class="cat" data-cat="parcel">📦 Parcel received</button>
        <button class="cat" data-cat="leak">💧 Leak / damage</button>
        <button class="cat" data-cat="other">❓ Other</button>
      </div>
    </div>
    <div class="card">
      <h2>Photo (recommended)</h2>
      <input type="file" id="photo" accept="image/*" capture="environment" onchange="onPhoto(event)">
      <img class="preview" id="preview">
      <input type="text" id="postNote" placeholder="Add a note (optional)" style="margin-top:12px;">
    </div>
    <button id="btnSend" onclick="sendReport()">Send to Nawaf</button>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
const ENDPOINT = 'https://script.google.com/macros/s/AKfycbx7Or57ifQW5hjwgw-ZZAW-I1kNhRibOvZyusJuAmYwho8YWqx81Yyv7380oR9dnhs/exec';
const ITEMS = ['Exterior walk — no damage or entry signs','Post & packages cleared','Leaks / damp checked','Ran taps + flushed toilets','Boiler / thermostat normal','Bins handled (out / in)','Verisure armed, no faults','Plants / garden done'];
let CODE = localStorage.getItem('mw_code_write') || '';
let photoData = null, CAT = 'bill';

function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2600); }
function boot(){
  if(CODE){ document.getElementById('gate').classList.add('hide'); document.getElementById('app').classList.remove('hide'); document.getElementById('mainApp').classList.remove('hide'); }
  const cl=document.getElementById('checklist');
  ITEMS.forEach((t,i)=>{ const l=document.createElement('label'); l.className='chk'; l.innerHTML='<input type="checkbox" data-i="'+i+'"><span>'+t+'</span>'; cl.appendChild(l); });
  document.querySelectorAll('#cats .cat').forEach(b=>b.onclick=()=>{ CAT=b.dataset.cat; document.querySelectorAll('#cats .cat').forEach(x=>x.classList.remove('on')); b.classList.add('on'); });
}
function saveCode(){ const v=document.getElementById('codeInput').value.trim(); if(!v) return; CODE=v; localStorage.setItem('mw_code_write',v); boot(); }
function show(w){ document.getElementById('viewCheck').classList.toggle('hide',w!=='check'); document.getElementById('viewReport').classList.toggle('hide',w!=='report'); document.getElementById('tabCheck').classList.toggle('on',w==='check'); document.getElementById('tabReport').classList.toggle('on',w==='report'); }
async function post(p){ p.token=CODE; const r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)}); return r.json(); }

async function submitCheck(){
  const btn=document.getElementById('btnCheck'); btn.disabled=true;
  const done=[...document.querySelectorAll('#checklist input:checked')].map(c=>ITEMS[c.dataset.i]);
  const odd=document.getElementById('oddNote').value.trim(); const date=new Date().toISOString().slice(0,10);
  const note='Weekly check '+date+' — Done: '+(done.length?done.join(', '):'none')+(odd?(' | Odd: '+odd):'');
  try{ const res=await post({action:'checklist',source:'mathew',note:note});
    if(res.ok){ toast('Weekly check sent ✓'); document.querySelectorAll('#checklist input').forEach(c=>c.checked=false); document.getElementById('oddNote').value=''; }
    else toast('Error: '+(res.error||'try again')); }catch(e){ toast('No connection — try again'); }
  btn.disabled=false;
}
function onPhoto(ev){ const f=ev.target.files[0]; if(!f) return; const img=new Image(); const url=URL.createObjectURL(f);
  img.onload=()=>{ const max=1280; let w=img.width,h=img.height; if(w>h&&w>max){h=h*max/w;w=max;}else if(h>max){w=w*max/h;h=max;}
    const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
    const d=c.toDataURL('image/jpeg',0.7); photoData=d.split(',')[1]; const p=document.getElementById('preview'); p.src=d; p.style.display='block'; URL.revokeObjectURL(url); };
  img.src=url; }
async function sendReport(){
  const btn=document.getElementById('btnSend'); btn.disabled=true; btn.textContent='Sending…';
  const note=document.getElementById('postNote').value.trim();
  const payload={action:'upload',source:'mathew',type:CAT,note:note};
  if(photoData){ payload.photo=photoData; payload.contentType='image/jpeg'; payload.filename=CAT+'_'+Date.now()+'.jpg'; }
  try{ const res=await post(payload);
    if(res.ok){ toast('Sent to Nawaf ✓'); photoData=null; document.getElementById('preview').style.display='none'; document.getElementById('photo').value=''; document.getElementById('postNote').value=''; }
    else toast('Error: '+(res.error||'try again')); }catch(e){ toast('No connection — try again'); }
  btn.disabled=false; btn.textContent='Send to Nawaf';
}
boot();
</script>
</body>
</html>
