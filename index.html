<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f54">
<title>23 Mayditch — Check</title>
<style>
  :root { --green:#1f6f54; --ink:#14211c; --muted:#6b7c74; --bg:#f4f6f5; --card:#fff; --line:#e2e7e4; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         background:var(--bg); color:var(--ink); padding:0 0 40px; }
  header { background:var(--green); color:#fff; padding:18px 18px calc(18px + env(safe-area-inset-top)); }
  header h1 { margin:0; font-size:19px; }
  header p { margin:4px 0 0; opacity:.85; font-size:13px; }
  main { max-width:560px; margin:0 auto; padding:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin:14px 0; }
  h2 { font-size:16px; margin:0 0 12px; }
  label.chk { display:flex; align-items:flex-start; gap:12px; padding:11px 0; border-bottom:1px solid var(--line); }
  label.chk:last-of-type { border-bottom:0; }
  label.chk input { width:24px; height:24px; margin-top:1px; accent-color:var(--green); flex:0 0 auto; }
  textarea, input[type=text] { width:100%; border:1px solid var(--line); border-radius:10px; padding:12px; font:inherit; }
  textarea { min-height:70px; resize:vertical; }
  button { width:100%; border:0; border-radius:12px; padding:15px; font:600 16px inherit; color:#fff;
           background:var(--green); margin-top:14px; }
  button.ghost { background:#eef2f0; color:var(--ink); }
  button:disabled { opacity:.5; }
  .tabs { display:flex; gap:8px; margin:14px 0 0; }
  .tabs button { margin:0; background:#eef2f0; color:var(--muted); }
  .tabs button.on { background:var(--green); color:#fff; }
  .preview { width:100%; border-radius:10px; margin-top:12px; display:none; }
  .toast { position:fixed; left:16px; right:16px; bottom:16px; background:var(--ink); color:#fff;
           padding:14px 16px; border-radius:12px; text-align:center; opacity:0; transition:.25s; pointer-events:none; max-width:528px; margin:0 auto; }
  .toast.show { opacity:1; }
  .gate { position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; padding:24px; }
  .gate .card { max-width:360px; width:100%; }
  .muted { color:var(--muted); font-size:13px; }
  .hide { display:none; }
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="card">
    <h2>23 Mayditch — Check</h2>
    <p class="muted">Enter the access code Nawaf gave you. You only do this once on this phone.</p>
    <input type="text" id="codeInput" placeholder="Access code" autocomplete="off">
    <button onclick="saveCode()">Continue</button>
  </div>
</div>

<header class="hide" id="app">
  <h1>23 Mayditch</h1>
  <p>Weekly check &amp; post — synced to Nawaf</p>
</header>

<main class="hide" id="mainApp">
  <div class="tabs">
    <button class="on" id="tabCheck" onclick="show('check')">Weekly check</button>
    <button id="tabPost" onclick="show('post')">Photograph post</button>
  </div>

  <section id="viewCheck">
    <div class="card">
      <h2>Tick what you did</h2>
      <div id="checklist"></div>
    </div>
    <div class="card">
      <h2>Anything odd or needs attention?</h2>
      <textarea id="oddNote" placeholder="Leave blank if all fine"></textarea>
    </div>
    <button id="btnCheck" onclick="submitCheck()">Submit weekly check</button>
  </section>

  <section id="viewPost" class="hide">
    <div class="card">
      <h2>Photograph a letter / parcel</h2>
      <p class="muted">Take a clear photo of the post. Add what it is if you know.</p>
      <input type="file" id="photo" accept="image/*" capture="environment" onchange="onPhoto(event)">
      <img class="preview" id="preview">
      <input type="text" id="postNote" placeholder="What is it? (optional, e.g. 'TV Licence letter')" style="margin-top:12px;">
    </div>
    <button id="btnSend" onclick="sendPhoto()" disabled>Send to Nawaf</button>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
const ENDPOINT = 'https://script.google.com/macros/s/AKfycbx7Or57ifQW5hjwgw-ZZAW-I1kNhRibOvZyusJuAmYwho8YWqx81Yyv7380oR9dnhs/exec';
const ITEMS = [
  'Exterior walk — no damage or entry signs',
  'Post & packages cleared',
  'Leaks / damp checked',
  'Ran taps + flushed toilets',
  'Boiler / thermostat normal',
  'Bins handled (out / in)',
  'Verisure armed, no faults',
  'Plants / garden done'
];
let CODE = localStorage.getItem('mw_code') || '';
let photoData = null;

function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2600); }

function boot(){
  if(CODE){ document.getElementById('gate').classList.add('hide'); document.getElementById('app').classList.remove('hide'); document.getElementById('mainApp').classList.remove('hide'); }
  const cl=document.getElementById('checklist');
  ITEMS.forEach((t,i)=>{ const l=document.createElement('label'); l.className='chk';
    l.innerHTML='<input type="checkbox" data-i="'+i+'"><span>'+t+'</span>'; cl.appendChild(l); });
}
function saveCode(){ const v=document.getElementById('codeInput').value.trim(); if(!v) return; CODE=v; localStorage.setItem('mw_code',v); boot(); }
function show(which){
  document.getElementById('viewCheck').classList.toggle('hide', which!=='check');
  document.getElementById('viewPost').classList.toggle('hide', which!=='post');
  document.getElementById('tabCheck').classList.toggle('on', which==='check');
  document.getElementById('tabPost').classList.toggle('on', which==='post');
}

async function post(payload){
  payload.token = CODE;
  const r = await fetch(ENDPOINT, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(payload) });
  return r.json();
}

async function submitCheck(){
  const btn=document.getElementById('btnCheck'); btn.disabled=true;
  const done=[...document.querySelectorAll('#checklist input:checked')].map(c=>ITEMS[c.dataset.i]);
  const odd=document.getElementById('oddNote').value.trim();
  const date=new Date().toISOString().slice(0,10);
  let note='Weekly check '+date+' — Done: '+(done.length?done.join(', '):'none')+(odd?(' | Odd: '+odd):'');
  try{ const res=await post({action:'checklist', source:'mathew', note:note});
    if(res.ok){ toast('Weekly check sent ✓'); document.querySelectorAll('#checklist input').forEach(c=>c.checked=false); document.getElementById('oddNote').value=''; }
    else toast('Error: '+(res.error||'try again')); }
  catch(e){ toast('No connection — try again'); }
  btn.disabled=false;
}

function onPhoto(ev){
  const f=ev.target.files[0]; if(!f) return;
  const img=new Image(); const url=URL.createObjectURL(f);
  img.onload=()=>{ const max=1280; let {width:w,height:h}=img;
    if(w>h && w>max){ h=h*max/w; w=max; } else if(h>max){ w=w*max/h; h=max; }
    const c=document.createElement('canvas'); c.width=w; c.height=h;
    c.getContext('2d').drawImage(img,0,0,w,h);
    const dataUrl=c.toDataURL('image/jpeg',0.7);
    photoData=dataUrl.split(',')[1];
    const p=document.getElementById('preview'); p.src=dataUrl; p.style.display='block';
    document.getElementById('btnSend').disabled=false; URL.revokeObjectURL(url); };
  img.src=url;
}

async function sendPhoto(){
  if(!photoData) return;
  const btn=document.getElementById('btnSend'); btn.disabled=true; btn.textContent='Sending…';
  const note=document.getElementById('postNote').value.trim();
  try{ const res=await post({action:'upload', source:'mathew', type:'post', note:note, photo:photoData, contentType:'image/jpeg', filename:'post_'+Date.now()+'.jpg'});
    if(res.ok){ toast('Post sent to Nawaf ✓'); photoData=null; document.getElementById('preview').style.display='none';
      document.getElementById('photo').value=''; document.getElementById('postNote').value=''; }
    else toast('Error: '+(res.error||'try again')); }
  catch(e){ toast('No connection — try again'); }
  btn.disabled=false; btn.textContent='Send to Nawaf';
}

boot();
</script>
</body>
</html>
