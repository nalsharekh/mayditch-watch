<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WhatsApp Sync</title>
<style>
  body{margin:0;font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f4f6f8;color:#152029;padding:20px;}
  .card{max-width:620px;margin:0 auto;background:#fff;border:1px solid #e2e7ec;border-radius:14px;padding:18px;}
  h2{margin:0 0 6px;font-size:18px;} p{color:#6b7c88;font-size:13px;margin:0 0 14px;}
  textarea,input{width:100%;box-sizing:border-box;border:1px solid #e2e7ec;border-radius:10px;padding:12px;font:inherit;}
  textarea{min-height:220px;resize:vertical;font-family:ui-monospace,Menlo,monospace;font-size:14px;}
  button{width:100%;border:0;border-radius:12px;padding:14px;font:600 16px inherit;color:#fff;background:#1b3a5c;margin-top:12px;}
  button:disabled{opacity:.5;} pre{background:#f4f6f8;border-radius:10px;padding:12px;white-space:pre-wrap;font-size:14px;margin-top:12px;}
</style>
</head>
<body>
<div class="card">
  <h2>WhatsApp → Waiting Reply</h2>
  <p>One per line: <b>Contact | preview</b>. Click Send. Contacts not in this list get auto-marked replied.</p>
  <input type="text" id="code" placeholder="Admin code (filled if saved)">
  <textarea id="data" placeholder="Abdullah | Happy birthday&#10;Janeth | Good morning"></textarea>
  <button id="btn" onclick="sync()">Send to inbox</button>
  <pre id="out" style="display:none"></pre>
</div>
<script>
const ENDPOINT='https://script.google.com/macros/s/AKfycbx7Or57ifQW5hjwgw-ZZAW-I1kNhRibOvZyusJuAmYwho8YWqx81Yyv7380oR9dnhs/exec';
document.getElementById('code').value=localStorage.getItem('mw_code_admin')||'';
async function sync(){
  const code=document.getElementById('code').value.trim();
  if(code) localStorage.setItem('mw_code_admin',code);
  const items=document.getElementById('data').value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
    const i=l.indexOf('|'); const c=i>=0?l.slice(0,i).trim():l.trim(); const p=i>=0?l.slice(i+1).trim():'';
    return {contact:c,preview:p};
  });
  const out=document.getElementById('out'); out.style.display='block'; out.textContent='Sending '+items.length+' items…';
  const btn=document.getElementById('btn'); btn.disabled=true;
  try{ const r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:code,action:'wa_sync',items:items})});
    const d=await r.json(); out.textContent=JSON.stringify(d,null,2)+(d.ok?'\n\n✅ Done. Open your inbox.':'\n\n❌ '+ (d.error||'')); }
  catch(e){ out.textContent='❌ '+e; }
  btn.disabled=false;
}
</script>
</body>
</html>
